# Release: build the NSIS installer and make a DRAFT GitHub release.
#
# - Push of a tag "v*" (for example v0.2.0): build, check the versions,
#   then make a draft release. The owner publishes the draft by hand.
# - workflow_dispatch: a dry run. The installer and SHA256SUMS.txt go to a
#   workflow artifact only. No release is made.
#
# The updater: the build signs the installer with the private key of the
# secret TAURI_SIGNING_PRIVATE_KEY (no password). The release job writes
# latest.json and checks the signature with the public key of
# ui/tauri.conf.json. The program reads
# releases/latest/download/latest.json: a draft does not reach the users,
# only a published release does. A tag build without the secret stops. A
# dry run without the secret builds without the updater files.
#
# The build calls the Tauri CLI from ui/web/package-lock.json (npm ci). It
# does not use tauri-apps/tauri-action: the local command is the same, and
# the CLI version comes from the lockfile.
#
# Do not set RUSTFLAGS in this workflow (see ci.yml).

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Each job sets its own permissions.
permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  # Keep these values the same as in ci.yml and docs/BUILDING.md.
  RUST_TOOLCHAIN: "1.97.1"
  NODE_VERSION: "24"
  SHERPA_ONNX_STEM: sherpa-onnx-v2.0.1-win-x64-static-MT-Release-lib
  SHERPA_ONNX_URL: https://github.com/k2-fsa/sherpa-onnx/releases/download/v2.0.1/sherpa-onnx-v2.0.1-win-x64-static-MT-Release-lib.tar.bz2
  SHERPA_ONNX_SHA256: 23e7b986b197eda0bbc47ff3d7d5c87afd6ef2b9077214ba26b0f1ec52ef0e66

defaults:
  run:
    shell: pwsh

jobs:
  build:
    name: Build the installer
    runs-on: windows-latest
    timeout-minutes: 90
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      installer: ${{ steps.package.outputs.installer }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the Rust toolchain
        run: |
          rustup toolchain install $env:RUST_TOOLCHAIN --profile minimal
          rustup default $env:RUST_TOOLCHAIN
          rustc --version
          cargo --version

      # No Rust cache here: a release builds from a clean state.

      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Check the versions
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          $app = (Get-Content -Raw -Path ui/tauri.conf.json | ConvertFrom-Json).version
          $web = (Get-Content -Raw -Path ui/web/package.json | ConvertFrom-Json).version
          $metadata = cargo metadata --no-deps --format-version 1 --locked | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw "cargo metadata failed." }
          $bad = @()
          foreach ($package in $metadata.packages) {
            if ($package.version -ne $app) { $bad += "crate $($package.name) has $($package.version)" }
          }
          if ($web -ne $app) { $bad += "ui/web/package.json has $web" }
          if ($env:REF_TYPE -eq 'tag') {
            $tag = $env:REF_NAME
            if ($tag -ne "v$app") { $bad += "the tag is $tag, but ui/tauri.conf.json has $app (expected tag v$app)" }
          } elseif ($env:EVENT_NAME -eq 'push') {
            throw "A release push must be a tag."
          } else {
            Write-Host "Dry run on $($env:REF_NAME). No tag check."
          }
          if ($bad.Count -gt 0) {
            foreach ($line in $bad) { Write-Host "::error::Version mismatch: $line" }
            throw "The versions do not agree. Set the same version in ui/tauri.conf.json, ui/web/package.json and every Cargo.toml."
          }
          Write-Host "Version $app"
          "version=$app" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      # Keep this step the same as in ci.yml.
      - name: Get the sherpa-onnx libraries (pinned SHA-256)
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'sherpa-onnx'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $archive = Join-Path $dir "$env:SHERPA_ONNX_STEM.tar.bz2"
          curl.exe --fail --location --silent --show-error --retry 3 --output $archive $env:SHERPA_ONNX_URL
          if ($LASTEXITCODE -ne 0) { throw "The download of $env:SHERPA_ONNX_URL failed." }
          $hash = (Get-FileHash -Algorithm SHA256 -Path $archive).Hash.ToLowerInvariant()
          if ($hash -ne $env:SHERPA_ONNX_SHA256) {
            throw "SHA-256 mismatch for the sherpa-onnx archive: expected $env:SHERPA_ONNX_SHA256, got $hash."
          }
          & "$env:SystemRoot\System32\tar.exe" -xjf $archive -C $dir
          if ($LASTEXITCODE -ne 0) { throw "tar could not unpack the sherpa-onnx archive." }
          Remove-Item -Path $archive
          $lib = Join-Path $dir "$env:SHERPA_ONNX_STEM\lib"
          if (-not (Test-Path (Join-Path $lib 'onnxruntime.lib'))) { throw "No onnxruntime.lib in $lib." }
          "SHERPA_ONNX_LIB_DIR=$lib" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Install the web dependencies (with the Tauri CLI)
        working-directory: ui/web
        run: npm ci

      # tauri build does not take --locked. This step fails when Cargo.lock
      # is not up to date, so the build uses the committed lockfile.
      - name: Check Cargo.lock
        run: cargo fetch --locked

      # With "bundle.createUpdaterArtifacts": true, tauri build fails
      # without the private key. A tag build must sign. A dry run without
      # the secret (for example in a fork) builds without the updater files.
      - name: Check the updater signing key
        id: signing
        env:
          REF_TYPE: ${{ github.ref_type }}
          HAS_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
        run: |
          if ($env:HAS_KEY -eq 'true') {
            Write-Host "The installer gets an updater signature."
            "sign=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          } elseif ($env:REF_TYPE -eq 'tag') {
            Write-Host "::error::The secret TAURI_SIGNING_PRIVATE_KEY is empty. A release needs the updater signature. Add the secret, then make the tag again."
            throw "No updater signing key."
          } else {
            Write-Host "::warning::Dry run without TAURI_SIGNING_PRIVATE_KEY: the build makes no updater signature."
            "sign=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          }

      - name: Build the NSIS installer
        working-directory: ui
        env:
          # The key has no password. tauri build writes "<installer>.sig".
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
          SIGN: ${{ steps.signing.outputs.sign }}
        run: |
          if ($env:SIGN -eq 'true') {
            & ./web/node_modules/.bin/tauri.cmd build
          } else {
            & ./web/node_modules/.bin/tauri.cmd build --config no-updater-artifacts.conf.json
          }
          if ($LASTEXITCODE -ne 0) { throw "tauri build failed." }

      - name: Package the installer and its SHA-256
        id: package
        env:
          VERSION: ${{ steps.version.outputs.version }}
          SIGN: ${{ steps.signing.outputs.sign }}
        run: |
          $found = @(Get-ChildItem -Path target/release/bundle/nsis -Filter '*-setup.exe')
          if ($found.Count -ne 1) { throw "Expected one installer in target/release/bundle/nsis, found $($found.Count)." }
          $out = Join-Path $env:RUNNER_TEMP 'release'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          # A file name without spaces: GitHub changes spaces in asset names.
          $name = "EDCoPilot-VoiceBridge_$($env:VERSION)_x64-setup.exe"
          Copy-Item -Path $found[0].FullName -Destination (Join-Path $out $name)
          $hash = (Get-FileHash -Algorithm SHA256 -Path (Join-Path $out $name)).Hash.ToLowerInvariant()
          [System.IO.File]::WriteAllText((Join-Path $out 'SHA256SUMS.txt'), "$hash  $name`n")
          # The signature covers the bytes of the file, not its name. Thus it
          # stays correct for the new name.
          $sig = "$($found[0].FullName).sig"
          if ($env:SIGN -eq 'true') {
            if (-not (Test-Path $sig)) { throw "tauri build made no updater signature $sig." }
            Copy-Item -Path $sig -Destination (Join-Path $out "$name.sig")
          } elseif (Test-Path $sig) {
            throw "An updater signature exists, but the build had no key: $sig."
          }
          Write-Host "$hash  $name"
          "installer=$name" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "sha256=$hash" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Upload the installer as a workflow artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: voicebridge-installer
          path: ${{ runner.temp }}/release/
          if-no-files-found: error
          retention-days: 14

  release:
    name: Make the draft release
    needs: build
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      # Only two files are necessary here: CHANGELOG.md has the hand-written
      # notes, ui/tauri.conf.json has the public key of the updater.
      - name: Check out the change log and the updater key
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            CHANGELOG.md
            ui/tauri.conf.json
          sparse-checkout-cone-mode: false

      - name: Download the installer artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: voicebridge-installer
          path: release

      - name: Check the SHA-256
        working-directory: release
        run: sha256sum --check SHA256SUMS.txt

      # The changes come from the section "## <version>" of CHANGELOG.md. A
      # person writes that section before the tag is made. The release
      # notes and latest.json both use changes.md.
      - name: Get the changes of this version
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          awk -v v="${VERSION}" '
            /^## / { on = ($2 == v); next }
            on { print }
          ' CHANGELOG.md | sed -e '/./,$!d' > changes.md
          if [ -z "$(tr -d '[:space:]' < changes.md)" ]; then
            echo "::error::CHANGELOG.md has no section \"## ${VERSION}\" with text. Write the changes of this version, then make the tag again."
            exit 1
          fi
          cat changes.md

      # The static update file of the Tauri updater. jq makes the JSON, so
      # quotes and line breaks in the notes stay correct.
      - name: Write latest.json
        env:
          VERSION: ${{ needs.build.outputs.version }}
          INSTALLER: ${{ needs.build.outputs.installer }}
          TAG: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          sig="release/${INSTALLER}.sig"
          if [ ! -s "$sig" ]; then
            echo "::error::The artifact has no updater signature ${INSTALLER}.sig."
            exit 1
          fi
          jq -n \
            --arg version "${VERSION}" \
            --rawfile notes changes.md \
            --arg pub_date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --rawfile signature "$sig" \
            --arg url "https://github.com/${REPOSITORY}/releases/download/${TAG}/${INSTALLER}" \
            '{
              version: $version,
              notes: ($notes | sub("\\s+$"; "")),
              pub_date: $pub_date,
              platforms: {
                "windows-x86_64": {
                  signature: ($signature | gsub("\\s"; "")),
                  url: $url
                }
              }
            }' > release/latest.json
          cat release/latest.json

      # The checks before the release: the file is JSON, its version is the
      # tag, the address is the asset, and the signature is correct for
      # the public key of ui/tauri.conf.json. Tauri keys and signatures are
      # minisign files in base64.
      - name: Check latest.json and the signature
        env:
          VERSION: ${{ needs.build.outputs.version }}
          INSTALLER: ${{ needs.build.outputs.installer }}
          TAG: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          file=release/latest.json
          jq -e . "$file" > /dev/null
          version="$(jq -r .version "$file")"
          if [ "$version" != "${VERSION}" ] || [ "v${version}" != "${TAG}" ]; then
            echo "::error::latest.json has the version ${version}, the tag is ${TAG}."
            exit 1
          fi
          signature="$(jq -r '.platforms["windows-x86_64"].signature // ""' "$file")"
          if [ -z "$signature" ]; then
            echo "::error::latest.json has no signature."
            exit 1
          fi
          url="$(jq -r '.platforms["windows-x86_64"].url' "$file")"
          if [ "$url" != "https://github.com/${REPOSITORY}/releases/download/${TAG}/${INSTALLER}" ]; then
            echo "::error::latest.json has the wrong address: ${url}"
            exit 1
          fi
          jq -e '.pub_date | fromdateiso8601' "$file" > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq minisign > /dev/null
          keys="$(mktemp -d)"
          jq -j '.plugins.updater.pubkey' ui/tauri.conf.json | base64 -d > "$keys/voicebridge.pub"
          printf '%s' "$signature" | base64 -d > "$keys/installer.minisig"
          minisign -V -p "$keys/voicebridge.pub" -m "release/${INSTALLER}" -x "$keys/installer.minisig" | tee "$keys/result.txt"
          # tauri build puts the version into the signed comment. The
          # program refuses a signature for another version.
          if ! grep -q "version:${VERSION}\$" "$keys/result.txt"; then
            echo "::error::The signature is not for version ${VERSION}."
            exit 1
          fi

      - name: Write the release notes
        env:
          VERSION: ${{ needs.build.outputs.version }}
          INSTALLER: ${{ needs.build.outputs.installer }}
          REPOSITORY: ${{ github.repository }}
          SERVER_URL: ${{ github.server_url }}
        run: |
          hash="$(cut -d ' ' -f 1 release/SHA256SUMS.txt)"
          changes="$(cat changes.md)"
          cat > notes.md <<EOF
          ## EDCoPilot VoiceBridge ${VERSION}

          ### Changes

          ${changes}

          ### Install

          1. Download \`${INSTALLER}\`.
          2. Start the installer. It installs for the current Windows user only and needs no administrator rights.

          ### Windows SmartScreen

          The installer has no code signature. Windows SmartScreen can show "Windows protected your PC".

          1. Click **More info**.
          2. Click **Run anyway**.

          ### Check the download (optional)

          The SHA-256 of the installer is:

          \`\`\`
          ${hash}
          \`\`\`

          In PowerShell, compare it with the output of this command (upper or lower case letters are the same):

          \`\`\`powershell
          (Get-FileHash -Algorithm SHA256 .\\${INSTALLER}).Hash
          \`\`\`

          \`SHA256SUMS.txt\` has the same value.

          ### Updates

          Version 0.2.0 and later look for a newer version and ask before they install it. The files \`latest.json\` and \`${INSTALLER}.sig\` are for this update check.

          ### More information

          Read the README: ${SERVER_URL}/${REPOSITORY}#readme
          EOF
          cat notes.md

      - name: Make the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          INSTALLER: ${{ needs.build.outputs.installer }}
        run: |
          gh release create "$TAG" \
            "release/${INSTALLER}" \
            "release/${INSTALLER}.sig" \
            release/SHA256SUMS.txt \
            release/latest.json \
            --draft \
            --verify-tag \
            --title "EDCoPilot VoiceBridge ${TAG}" \
            --notes-file notes.md
