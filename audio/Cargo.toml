[package]
name = "edcopilot-voicebridge-audio"
version = "0.2.0"
edition = "2021"
license.workspace = true

[dependencies]
anyhow = "1.0.104"
cpal = "0.18.2"
gilrs = "0.11.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_UI_Input_KeyboardAndMouse"] }

[target.'cfg(not(windows))'.dependencies]
device_query = "4.0.1"
